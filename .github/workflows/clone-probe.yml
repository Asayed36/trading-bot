# Temporary probe: why does `git clone origin.git server` fail on a runner?
name: Clone probe
on:
  push:
    branches: [claude/clone-probe]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Environment
        run: |
          git --version; nproc; df -h /tmp /home/runner | cat; mount | grep -E ' /tmp | / ' | head -3; id; echo "TMPDIR=$TMPDIR"
          git config --system --list 2>&1 | head -20; echo ---; git config --global --list 2>&1 | head
      - name: The whole test suite, 12 times in a row (the fixed tests)
        run: |
          pip install -r requirements.txt -r requirements-launch.txt -q
          fails=0
          for i in $(seq 1 12); do
            python -m unittest > /tmp/suite_$i.log 2>&1 && echo "run $i: OK $(tail -3 /tmp/suite_$i.log | head -1)" || { echo "run $i: FAILED"; fails=$((fails+1)); grep -B2 -A25 -E '^(ERROR|FAIL):' /tmp/suite_$i.log | head -60; }
          done
          echo "failed runs: $fails of 12"
          exit $fails
