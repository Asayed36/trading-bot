# Temporary probe: why does `git clone origin.git server` fail on a runner?
name: Clone probe
on:
  push:
    branches: [claude/clone-probe]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Environment
        run: |
          git --version; nproc; df -h /tmp /home/runner | cat; mount | grep -E ' /tmp | / ' | head -3; id; echo "TMPDIR=$TMPDIR"
          git config --system --list 2>&1 | head -20; echo ---; git config --global --list 2>&1 | head
      - name: The old setUp sequence, 4 in parallel for 240 s (stderr kept)
        run: |
          for k in 1 2 3 4; do python tests/_stress_clone.py 240 > /tmp/stress_$k.log 2>&1 & done; wait
          cat /tmp/stress_*.log
      - name: The new tests, 40 times in a row
        run: |
          pip install -r requirements.txt -q
          for i in $(seq 1 40); do python -m unittest tests.test_launch_ops tests.test_repair tests.test_gitutil 2>&1 | tail -3 | tr '\n' ' '; echo; done
