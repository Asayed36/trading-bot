# Once a day, posts a side-by-side comparison of the paper strategies (main,
# early, convergence, news and launch, plus the convergence strategy's Helius
# credit use) for the previous UTC day as a GitHub issue labelled
# "daily-comparison", and closes the previous day's issue. A health section at
# the top shows whether everything is running and warns about anything stale
# or broken.
#
# Read-only: it only reads data/ and posts the issue. No secrets, keys or
# wallets are used.

name: Daily strategy comparison

on:
  schedule:
    - cron: "7 0 * * *"      # 00:07 UTC, just after the day it reports on ends
  workflow_dispatch:         # lets you post one by hand from the Actions tab

# GitHub's schedule and the server's backup trigger
# (deploy/trigger_paper_run.py) can start runs at almost the same moment (on
# 2026-10-07 both posted, issues 331 and 332). One at a time: a second run
# waits for the first, then finds its issue and posts nothing.
concurrency:
  group: daily-comparison
  cancel-in-progress: false

permissions:
  contents: read
  issues: write              # needed to post and close the comparison issues
  actions: read              # for the health section: failed runs in the last 24h

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Compare yesterday's results
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python compare.py --date yesterday --github-issue | tee comparison.md
          cat comparison.md >> "$GITHUB_STEP_SUMMARY"
