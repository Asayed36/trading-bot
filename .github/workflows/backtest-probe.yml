# TEMPORARY: checks which free price sources a GitHub-hosted runner can reach
# (for the backtest tool). Reads public data only; no keys, no secrets.
name: Backtest source probe

on:
  push:
    branches: [claude/gallant-faraday-y6gzq8]
    paths: [".github/workflows/backtest-probe.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Try each source
        run: |
          python3 - <<'EOF'
          import json, time, urllib.request, concurrent.futures as cf
          SOURCES = [
            ("binance archive: monthly 1h", "https://data.binance.vision/data/spot/monthly/klines/BTCUSDT/1h/BTCUSDT-1h-2022-06.zip"),
            ("binance archive: monthly 1d", "https://data.binance.vision/data/spot/monthly/klines/BTCUSDT/1d/BTCUSDT-1d-2022-06.zip"),
            ("binance archive: monthly 1h 2026-09", "https://data.binance.vision/data/spot/monthly/klines/BTCUSDT/1h/BTCUSDT-1h-2026-09.zip"),
            ("binance archive: daily 1h", "https://data.binance.vision/data/spot/daily/klines/BTCUSDT/1h/BTCUSDT-1h-2026-10-09.zip"),
            ("binance API", "https://api.binance.com/api/v3/klines?symbol=BTCUSDT&interval=1h&limit=2"),
            ("binance.us API", "https://api.binance.us/api/v3/klines?symbol=BTCUSDT&interval=1h&limit=2"),
            ("bybit API", "https://api.bybit.com/v5/market/kline?category=spot&symbol=BTCUSDT&interval=60&limit=2"),
            ("kraken API", "https://api.kraken.com/0/public/OHLC?pair=XBTUSD&interval=60"),
            ("coinbase exchange API", "https://api.exchange.coinbase.com/products/BTC-USD/candles?granularity=3600&start=2022-06-01T00:00:00Z&end=2022-06-02T00:00:00Z"),
            ("bitstamp API", "https://www.bitstamp.net/api/v2/ohlc/btcusd/?step=3600&limit=2"),
            ("okx API", "https://www.okx.com/api/v5/market/history-candles?instId=BTC-USDT&bar=1H&limit=2"),
            ("kucoin API", "https://api.kucoin.com/api/v1/market/candles?type=1hour&symbol=BTC-USDT"),
            ("bitfinex API", "https://api-pub.bitfinex.com/v2/candles/trade:1h:tBTCUSD/hist?limit=2"),
            ("gemini API", "https://api.gemini.com/v2/candles/btcusd/1hr"),
            ("yahoo chart", "https://query1.finance.yahoo.com/v8/finance/chart/BTC-USD?interval=1d&range=5d"),
          ]
          def get(u):
              t = time.time()
              try:
                  r = urllib.request.urlopen(urllib.request.Request(u, headers={"User-Agent": "backtest-probe/1.0"}), timeout=25)
                  b = r.read(); return r.status, len(b), b[:80], time.time() - t
              except urllib.error.HTTPError as e:
                  return e.code, 0, e.read()[:80], time.time() - t
              except Exception as e:
                  return type(e).__name__, 0, str(e)[:80].encode(), time.time() - t
          lines = []
          for name, u in SOURCES:
              st, n, head, dt = get(u)
              line = f"{name}: HTTP {st}, {n} bytes, {dt:.1f}s"
              if st != 200: line += f" ({head.decode(errors='replace')!r})"
              lines.append(line); print(line, flush=True)
              print(f"::notice title=source probe::{line}")
          # throughput of the archive: 36 monthly files with 8 threads
          urls = [f"https://data.binance.vision/data/spot/monthly/klines/ETHUSDT/1h/ETHUSDT-1h-{y}-{m:02d}.zip" for y in (2021, 2022, 2023) for m in range(1, 13)]
          t = time.time()
          with cf.ThreadPoolExecutor(8) as ex:
              res = list(ex.map(get, urls))
          ok = sum(1 for r in res if r[0] == 200)
          line = f"binance archive throughput: {ok}/{len(urls)} files, {sum(r[1] for r in res)/1e6:.1f} MB in {time.time()-t:.1f}s with 8 threads"
          print(line); print(f"::notice title=source probe::{line}")
          with open(__import__("os").environ["GITHUB_STEP_SUMMARY"], "a") as fh:
              fh.write("## Source probe\n\n" + "\n".join(f"- {l}" for l in lines + [line]) + "\n")
          EOF
