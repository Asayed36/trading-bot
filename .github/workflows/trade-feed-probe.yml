# A short run of the trade feed probe (trade_feed_probe.py) on GitHub, to
# check it works before the 2-hour measurement on your server. Research
# only: no trading, no keys, no wallet; nothing is saved to the repository
# (the summary is shown on the run's page).

name: Trade feed probe (short test)

on:
  workflow_dispatch:
    inputs:
      minutes:
        description: "Minutes to measure (at most 120)"
        required: false
        default: "5"
  push:
    paths:
      - trade_feed_probe.py
      - .github/workflows/trade-feed-probe.yml

permissions:
  contents: read             # it only reads the code; nothing is written back

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 130
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt -r requirements-launch.txt

      - name: THROWAWAY proof of the Binance backdrop
        run: |
          python - <<'PY'
          import os, tempfile, requests
          from screener.backdrop import MarketBackdrop
          calls = []
          def counting_get(url, **kw):
              calls.append((url, kw))
              r = requests.get(url, **kw)
              print("REQUEST", r.status_code, r.url)
              return r
          cache = os.path.join(tempfile.mkdtemp(), "backdrop_cache.json")
          first = MarketBackdrop(cache, get=counting_get)
          print("FIRST PROCESS VALUES:", first())
          print("FIRST PROCESS AGAIN (memory cache):", first())
          print("REQUESTS SO FAR:", len(calls))
          second = MarketBackdrop(cache, get=counting_get)       # a new process, same file
          print("SECOND PROCESS VALUES (from the file):", second())
          print("REQUESTS IN TOTAL:", len(calls))
          print("EXTRA KWARGS SENT:", sorted({k for _, kw in calls for k in kw}))
          print("CACHE FILE:", open(cache).read())
          PY
