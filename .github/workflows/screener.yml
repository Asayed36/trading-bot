# Runs the paper strategies ("main", "early", "convergence", "news" and
# "robinhood") every 5 minutes and saves their results (data/journal.csv,
# data/positions.json and the same files in data/early/, data/convergence/,
# data/news/ and data/robinhood/) back to
# the repository, so each run picks up the pretend positions left by the
# previous one. The news strategy only checks the news every 15 minutes.
#
# Read-only: no wallets or private keys are used. The only secrets are the
# optional HELIUS_API_KEY (a free data-access key for the convergence
# strategy, see the README; without it that strategy just stays inactive)
# the optional COINGECKO_API_KEY (a free CoinGecko Demo key for the news
# strategy's prices; without it the public API is tried) and the optional
# CLAUDE_API_KEY (an Anthropic API key for the news strategy's AI check of
# headlines; without it the rule-based checks run alone).
# The only things it writes are the commit of the data files (only when a run
# actually changed them) and GitHub issues: one "PASSED: SYMBOL" issue per
# token that passes the main, early or news strategy, closed with the result when
# its paper position closes.
# If DexScreener or RugCheck rate-limit the main strategy, that run is skipped
# and nothing is saved; the next run 15 minutes later tries again.

name: Paper trading run

on:
  schedule:
    # Every 5 minutes (UTC); GitHub may start it a few minutes late. Keep
    # [schedule] run_every_minutes in config.toml the same. The convergence
    # strategy still reads Helius only every 15 minutes (see config.toml).
    - cron: "*/5 * * * *"
  workflow_dispatch:         # start a run by hand from the Actions tab; the launch-bot
                             # server also uses this every 10 min when GitHub's schedule
                             # drops runs (deploy/trigger_paper_run.py)

permissions:
  contents: write            # needed to commit data/ back to the repository
  issues: write              # needed to open and close the "passed" issues

# Never let two runs overlap: both would start from the same positions and
# the second push would lose the first run's trades. A run that starts while
# another is going waits for it; if several pile up, GitHub keeps only the
# newest waiting one.
concurrency:
  group: paper-trading
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Start from the branch as it is NOW, not the commit the run was queued
      # on: a run that waited behind another one would otherwise start from
      # stale positions and its save would conflict with the previous run's.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # requirements-launch.txt (websockets) isn't needed to trade here, but
      # the tests below also cover the launch bot, which imports it.
      - name: Install
        run: pip install -r requirements.txt -r requirements-launch.txt

      - name: Tests
        run: python -m unittest -v

      - name: Screen and paper trade
        id: screen
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
        run: |
          set +e
          python run.py --github-issues 2>&1 | tee report.txt
          code=${PIPESTATUS[0]}
          set -e
          {
            echo '## Screener report'
            echo '```'
            cat report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # 75 = rate limited (see EXIT_RATE_LIMITED in run.py). run.py fetches
          # everything before touching any paper trade, so nothing changed;
          # mark the run as skipped instead of failed.
          if [ "$code" -eq 75 ]; then
            echo "::notice::Rate limited by DexScreener or RugCheck - run skipped, nothing saved."
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          exit "$code"

      - name: Save results to the repository
        if: steps.screen.outputs.skipped != 'true'
        shell: bash
        run: |
          # Only commit when something that matters changed: a new journal row
          # (a buy or sell), or a change to the positions other than
          # last_price. last_price is just for display and moves every run, so
          # on its own it would mean a commit every 15 minutes.
          # The convergence strategy's positions.json also holds its Helius
          # credit count, which changes on every run that uses credits; that
          # has to be saved so the monthly limit is never passed.
          journal_changed=$(git status --porcelain -- data/journal.csv data/early/journal.csv \
            data/convergence/journal.csv data/news/journal.csv data/news/candidates.csv \
            data/news/unmatched.csv data/news/ai_verdicts.csv data/robinhood/journal.csv \
            data/robinhood/candidates.csv data/schedule.json)
          if [ -z "$journal_changed" ] && python - <<'PY'
          import json, os, subprocess, sys

          def strip(text, path):
              state = json.loads(text)
              for pos in state.get("open_positions", []):
                  pos.pop("last_price", None)
              if path == "data/robinhood/positions.json":
                  state.pop("sources", None)  # call counts and times: every run
              return state

          for path in ("data/positions.json", "data/early/positions.json",
                       "data/convergence/positions.json", "data/news/positions.json",
                       "data/robinhood/positions.json"):
              if not os.path.exists(path):
                  continue
              old = subprocess.run(["git", "show", f"HEAD:{path}"],
                                   capture_output=True, text=True)
              if old.returncode != 0:
                  sys.exit(1)  # not in the repository yet, so it's new
              with open(path) as fh:
                  if strip(old.stdout, path) != strip(fh.read(), path):
                      sys.exit(1)
          # data/health.json (each strategy's last good run, for the daily
          # comparison's health section) changes every run: save it at least
          # every 30 minutes even when nothing else changed.
          from datetime import datetime, timedelta, timezone
          old = subprocess.run(["git", "show", "HEAD:data/health.json"],
                               capture_output=True, text=True)
          if old.returncode != 0:
              sys.exit(1)
          saved = datetime.fromisoformat(json.loads(old.stdout)["updated"])
          if datetime.now(timezone.utc) - saved >= timedelta(minutes=30):
              sys.exit(1)
          sys.exit(0)
          PY
          then
            echo "Nothing changed this run, so nothing to save."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/journal.csv data/positions.json
          # entries.csv only changes together with a journal BUY row.
          for f in data/entries.csv data/early/entries.csv data/convergence/entries.csv \
                   data/early/journal.csv data/early/positions.json \
                   data/convergence/journal.csv data/convergence/positions.json \
                   data/news/journal.csv data/news/positions.json data/news/entries.csv \
                   data/news/candidates.csv data/news/unmatched.csv data/news/ai_verdicts.csv \
                   data/robinhood/journal.csv data/robinhood/positions.json \
                   data/robinhood/entries.csv data/robinhood/candidates.csv \
                   data/schedule.json data/health.json; do
            if [ -f "$f" ]; then git add "$f"; fi
          done
          git commit -m "Paper trading run $(date -u '+%Y-%m-%d %H:%M UTC')"
          # If someone pushed in the meantime, replay our commit on top and
          # retry; also rides out a short GitHub server error ("Internal Server
          # Error" on push, 2026-10-05): 5 attempts over about 100 seconds.
          for attempt in 1 2 3 4 5; do
            git push && exit 0
            [ "$attempt" -lt 5 ] || break
            sleep $((attempt * 10))
            git pull --rebase
          done
          echo "Could not push the results after 5 attempts." >&2
          exit 1
