# Runs both paper strategies ("main" and "early") every 15 minutes and saves
# their results (data/journal.csv, data/positions.json and the same two files
# in data/early/) back to the repository, so each run picks up the pretend
# positions left by the previous one.
#
# Read-only: no secrets, keys or wallets are used. The only things it writes
# are the commit of those two files (only when a run actually changed them)
# and GitHub issues: one "PASSED: SYMBOL" issue per token that passes every
# filter, closed with the result when its paper position closes.
# If DexScreener or RugCheck rate-limit us, that run is skipped and nothing is
# saved; the next run 15 minutes later tries again.

name: Paper trading run

on:
  schedule:
    - cron: "*/15 * * * *"  # every 15 minutes (UTC); GitHub may start it a few minutes late
  workflow_dispatch:         # lets you start a run by hand from the Actions tab

permissions:
  contents: write            # needed to commit data/ back to the repository
  issues: write              # needed to open and close the "passed" issues

# Never let two runs overlap: both would start from the same positions and
# the second push would lose the first run's trades.
concurrency:
  group: paper-trading
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Tests
        run: python -m unittest -v

      - name: Screen and paper trade
        id: screen
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set +e
          python run.py --github-issues 2>&1 | tee report.txt
          code=${PIPESTATUS[0]}
          set -e
          {
            echo '## Screener report'
            echo '```'
            cat report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # 75 = rate limited (see EXIT_RATE_LIMITED in run.py). run.py fetches
          # everything before touching any paper trade, so nothing changed;
          # mark the run as skipped instead of failed.
          if [ "$code" -eq 75 ]; then
            echo "::notice::Rate limited by DexScreener or RugCheck - run skipped, nothing saved."
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          exit "$code"

      - name: Save results to the repository
        if: steps.screen.outputs.skipped != 'true'
        shell: bash
        run: |
          # Only commit when something that matters changed: a new journal row
          # (a buy or sell), or a change to the positions other than
          # last_price. last_price is just for display and moves every run, so
          # on its own it would mean a commit every 15 minutes.
          journal_changed=$(git status --porcelain -- data/journal.csv data/early/journal.csv)
          if [ -z "$journal_changed" ] && python - <<'PY'
          import json, os, subprocess, sys

          def strip(text):
              state = json.loads(text)
              for pos in state.get("open_positions", []):
                  pos.pop("last_price", None)
              return state

          for path in ("data/positions.json", "data/early/positions.json"):
              if not os.path.exists(path):
                  continue
              old = subprocess.run(["git", "show", f"HEAD:{path}"],
                                   capture_output=True, text=True)
              if old.returncode != 0:
                  sys.exit(1)  # not in the repository yet, so it's new
              with open(path) as fh:
                  if strip(old.stdout) != strip(fh.read()):
                      sys.exit(1)
          sys.exit(0)
          PY
          then
            echo "Nothing changed this run, so nothing to save."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/journal.csv data/positions.json
          for f in data/early/journal.csv data/early/positions.json; do
            if [ -f "$f" ]; then git add "$f"; fi
          done
          git commit -m "Paper trading run $(date -u '+%Y-%m-%d %H:%M UTC')"
          # If someone pushed in the meantime, replay our commit on top and retry.
          for attempt in 1 2 3; do
            git push && exit 0
            sleep $((attempt * 5))
            git pull --rebase
          done
          echo "Could not push the results after 3 attempts." >&2
          exit 1
