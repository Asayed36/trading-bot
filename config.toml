# =====================================================================
#  SETTINGS FOR THE MEMECOIN SCREENER
#  You can change any number below with a plain text editor.
#  Lines starting with "#" are notes for humans and are ignored.
#  After editing, just run the program again. No other changes needed.
# =====================================================================

# ---------------------------------------------------------------------
# FILTERS: a token must pass EVERY one of these to be "bought" (on paper)
# ---------------------------------------------------------------------
[filters]

# Only tokens that have "graduated" from the pump.fun bonding curve and
# now trade on a real exchange pool. These are DexScreener's names for them.
allowed_dexes = ["pumpswap", "raydium"]

# Market cap = price x number of tokens, in US dollars.
min_market_cap_usd = 100_000
max_market_cap_usd = 5_000_000

# Liquidity = how much money sits in the trading pool.
# Low liquidity means your sell could crash the price.
min_liquidity_usd = 30_000

# The 10 biggest wallets together must own LESS than this % of all tokens.
max_top10_holders_pct = 30

# The wallet that created the token must own LESS than this %.
max_creator_pct = 5

# At least this % of the pool's LP tokens must be locked or burned
# (so the creator can't pull the money out of the pool).
min_lp_locked_pct = 95

# If true, the pool's own wallet (which holds tokens for trading) is NOT
# counted as a "top holder". Leave this true.
exclude_pools_from_holders = true

# Skip tokens whose price went up more than this % in the last 24 hours
# (to avoid buying at the top of a huge spike).
max_price_change_24h_pct = 300

# The token must have at least this many trades in the last 24 hours...
min_txns_24h = 500
# ...and more buys than sells (true = required, false = ignored).
require_more_buys_than_sells = true

# Insider networks (groups of linked wallets) are shown as a WARNING.
# Set this to true if you'd rather treat them as a hard FAIL.
insider_networks_are_fail = false

# ---------------------------------------------------------------------
# PAPER TRADING: pretend trades, no real money ever
# ---------------------------------------------------------------------
[paper_trading]

# Pretend dollars "spent" on each buy.
buy_amount_usd = 10

# When the price is up this % from where we bought, sell HALF.
take_profit_pct = 50
take_profit_sell_fraction = 0.5

# Sell everything that's left if the price falls this % below our buy price.
stop_loss_pct = 30

# Sell everything that's left if the price falls this % below its highest point
# since we bought (a "trailing stop" that locks in gains).
trailing_stop_pct = 40

# If we've held this many hours and the price has moved less than
# stale_move_pct (up OR down), give up and sell.
max_hold_hours = 48
stale_move_pct = 10
# true (since 2026-10-09): after max_hold_hours, sell whatever the move (a
# position between -stale_move_pct and the stop loss was otherwise never sold).
time_exit_any_move = true

# Pretend cost of fees + slippage for one full buy-and-sell, as a % of the
# money put in. Charged proportionally each time we sell part of a position.
round_trip_cost_pct = 3

# If false, never buy the same token twice (even after we've sold it).
allow_rebuy = false

[main]
# The main strategy on GitHub (run.py). Stopped on 2026-10-05: 188 trades,
# 25% wins against 42% needed. Its rules live on in main (1 min) below.
# stopped = true: no new buys. Positions still open finish under their
# normal exits; the journal, positions and other files are kept.
stopped = true

# ---------------------------------------------------------------------
# MAIN (1 MIN): the main strategy checked every minute, on your own server
# (main_1min.py, deploy/main-1min.service). It uses exactly [filters] and
# [paper_trading] above, so only the timing differs from main. Its own
# results are in data/main-1min/ (pushed by deploy/push_results.sh once an
# hour). Paper trading only: no wallet, no keys, no real orders.
# ---------------------------------------------------------------------
[main_1min]
enabled = true
# main (1 min)'s own buying, stopped on 2026-10-07 (-$267 after costs over
# 223 trades). stopped = true: no new buys of its own; its open positions
# finish under the normal exits and its files are kept. Its checks still run
# every minute for the versions below.
stopped = true
folder = "main-1min"
every_seconds = 60
# RugCheck is only asked about tokens that pass the market checks, and only
# when they're new or their report (kept in memory) is older than this...
rugcheck_recheck_minutes = 10
# ...at most this many a minute (the rest wait for the next minute)...
rugcheck_max_per_run = 10
# ...and not at all for this long after it says "too many requests".
rugcheck_pause_minutes = 5
# Jupiter's organic score (version B's check, and every buy's entries.csv
# row) is read at most this often per token.
organic_cache_minutes = 10

# Paper versions of main (1 min), side by side on the same data every minute:
# main's checks plus one extra rule each, the same exits and costs
# ([paper_trading]), each with its own files in data/main-1min/<folder>/.
# A: buy only after a token passed main's checks on 3 consecutive one-minute
# checks (tokens that drop off DexScreener's lists while on a run of passes
# are still checked each minute, for A only). The counts start again when
# the bot restarts.
[[main_1min.versions]]
name = "A"
label = "main (1 min) A"
folder = "main-1min/a"
consecutive_passes = 3
# Stopped on 2026-10-07: worse than main (1 min) on the same tokens.
stopped = true

# B: skip tokens up more than 100% in the last hour (DexScreener), and
# require a Jupiter organic score of at least 60 (unknown = skip).
[[main_1min.versions]]
name = "B"
label = "main (1 min) B"
folder = "main-1min/b"
max_change_1h_pct = 100
min_organic_score = 60
# Paper buys pay 1.5% over the market price, for a person's reaction time
# (since 2026-10-09; the daily comparison says from when).
buy_slippage_pct = 1.5

# C: B's two rules, but decided once, at the minute a token first passes
# main's checks: bought then if it is up no more than 100% in the last hour
# and has a Jupiter organic score of 60+, else skipped for good (it never
# waits for a token to cool down, unlike B). Tokens main (1 min) had already
# passed before C started count as decided. A token is decided only once
# Jupiter has answered (if it doesn't, C asks again at the next minute the
# token passes); why each token was skipped is kept in its positions.json.
[[main_1min.versions]]
name = "C"
label = "main (1 min) C"
folder = "main-1min/c"
max_change_1h_pct = 100
min_organic_score = 60
first_pass_only = true
buy_slippage_pct = 1.5

# ---------------------------------------------------------------------
# EARLY STRATEGY: a second paper strategy that runs alongside the one above
# (its own positions and journal in data/early/). It looks for tokens under
# 6 hours old and buys them on a pullback after their first spike.
# Paper trading only: no wallet, no keys, no real orders.
# ---------------------------------------------------------------------
[early]
enabled = true
# Stopped on 2026-10-05: average win smaller than average loss.
# stopped = true: no new buys. Positions still open finish under their
# normal exits; the journal, positions and other files are kept.
stopped = true

# Only tokens that graduated to one of these (DexScreener's names)...
allowed_dexes = ["pumpswap", "raydium"]
# ...at least this many minutes ago...
min_minutes_since_graduation = 30
# ...and that are at most this many hours old.
max_token_age_hours = 6

# Pullback entry: the price must have spiked at least min_spike_pct, then
# fallen back between pullback_min_pct and pullback_max_pct below its peak,
# not be falling over the last 5 minutes, and have more buys than sells over
# the last hour.
min_spike_pct = 50
pullback_min_pct = 20
pullback_max_pct = 50

# Enough money in the pool to get out again.
min_liquidity_usd = 10_000
# The 10 biggest wallets (pools excluded) must own LESS than this %.
max_top10_holders_pct = 20
# At least this % of the pool's LP tokens must be locked or burned.
min_lp_locked_pct = 95

# Copycats: if other tokens with the same name or symbol were launched within
# this many days, only the one with the most liquidity is allowed; the rest
# are skipped.
copycat_window_days = 7

# A token worth less than this is "dead". Its creator is remembered, and any
# later token from them is skipped.
dead_token_max_mcap_usd = 5_000

# How many pages (20 pools each) of GeckoTerminal's newest pools to read,
# and at most how many never-seen tokens to look up on RugCheck per run.
gecko_pages = 3
max_new_tokens_per_run = 60

[early.paper_trading]
# Pretend dollars per buy (same as the main strategy, so results compare).
buy_amount_usd = 10
# Sell half at 2x.
take_profit_pct = 100
take_profit_sell_fraction = 0.5
# Sell everything left if the price falls this % below the buy price.
stop_loss_pct = 30
# Sell everything if take profit hasn't happened after this many minutes.
time_stop_minutes = 45
# After take profit, sell the rest when it falls this % from its peak...
trailing_stop_pct = 40
# ...or after this many hours, whichever comes first.
max_hold_hours = 24
# Fees + slippage for a full buy-and-sell, as a % of the money put in.
# Higher than the main strategy's 3% because young pools are thinner.
round_trip_cost_pct = 5
allow_rebuy = false

# ---------------------------------------------------------------------
# CONVERGENCE STRATEGY: a third paper strategy. Paper-buys a token when 3+
# wallets from a list of proven traders (grown every day) buy it within 20 minutes.
# Needs a free Helius API key in the HELIUS_API_KEY GitHub secret (see
# README). Paper trading only: it only reads public data, no wallet, no keys.
# ---------------------------------------------------------------------
[convergence]
enabled = true

# --- Helius free plan budget ---
helius_monthly_credits = 1_000_000
# Credits the bot counts per Helius call. Helius's price list says up to 10
# for getSignaturesForAddress/getTransaction ("archival"), but your dashboard
# showed about 1 per call for recent data (live checks) and about 2.5 per call
# when scoring candidates' 14-day histories. These estimates stay above what
# was measured, so the count errs high and the pause triggers early, never
# late. Compare with your Helius dashboard now and then.
helius_live_credits_per_call = 2
helius_history_credits_per_call = 4
# Pause the strategy (until the next cycle) rather than go past this %.
pause_at_pct = 80
# Day of the month your Helius credits reset. Set this to the day of the
# month you created your Helius account (1-28; use 28 for the 29th-31st).
helius_cycle_day = 28
helius_max_requests_per_second = 5
# How often to read tracked wallets from Helius. The workflow runs every
# 5 minutes, but this strategy only uses Helius on runs at least this far
# apart (with 2 minutes' slack for GitHub's start-time jitter), so credit use
# stays the same. Its open positions are still checked every run, for free.
helius_every_minutes = 15

# --- The signal ---
# Buy when at least min_wallets tracked wallets bought within window_minutes,
# and the last of those buys was at most max_signal_age_minutes ago.
min_wallets = 3
window_minutes = 20
max_signal_age_minutes = 20
# How many wallets to follow at most. 50 fits the Helius free plan when
# checked every 15 minutes: about 320k credits a month for live checks, at
# the estimates above, leaving the rest under the 80% pause for scoring
# candidates (paced per day, see refresh_credits_per_run). With live_rpc =
# "public" (the free public Solana RPC, no sign-up, less reliable) live
# checks cost no Helius credits at all.
tracked_wallets = 50
live_rpc = "helius"
# At most this many new transactions per wallet, and decoded per run.
max_new_tx_per_wallet = 25
max_decodes_per_run = 150

# --- The list of proven traders ---
# It grows as wallets qualify (up to tracked_wallets): a new round of
# candidates every refresh_every_hours (the next round starts once the last
# one is done). A wallet scored in the last recheck_days isn't scored again;
# a tracked wallet is scored again every recheck_days and leaves the list if
# it no longer qualifies.
refresh_every_hours = 24
recheck_days = 7
# Winners: tokens up at least this much in 24h, with this much liquidity.
winner_min_change_24h_pct = 100
winner_min_liquidity_usd = 30_000
# Candidates, from each of the week's top winners (the ones not used in the
# last winner_reuse_days first): wallets that recently sold it
# (GeckoTerminal's last 300 trades, free; sells of at least
# min_seller_trade_usd), and its biggest holders (RugCheck, free). Sellers
# matter most: holders who haven't sold have no closed trades to judge.
winners_per_refresh = 20
winner_reuse_days = 3
# Winners read a run (a GeckoTerminal and a RugCheck call each): a round's
# candidates are gathered over several runs, so a run never asks
# GeckoTerminal much (the robinhood strategy needs it in the same run).
winners_per_run = 2
sellers_per_winner = 25
min_seller_trade_usd = 50
holders_per_winner = 10
candidates_per_refresh = 150
# Each candidate's last history_days of swaps are read from Helius. Wallets
# with more transactions than max_tx_per_candidate in that time are treated
# as bots and skipped; wallets with fewer than 2 x min_closed_trades can't
# have enough closed trades, so their transactions aren't read (saves
# credits; the result is the same).
history_days = 14
max_tx_per_candidate = 150
# A candidate joins the list only with at least this many closed trades,
# this much realized profit, this win rate, and no single token making up
# more than max_top_token_share_pct of their profit.
min_closed_trades = 5
min_realized_sol = 2
min_win_rate_pct = 40
max_top_token_share_pct = 60
# Helius credits the list may use per run (it's spread over many runs), and
# per day at most an even share of what's left in the cycle after keeping
# enough for the live checks of the list until the cycle ends.
refresh_credits_per_run = 2_500

# --- Basic checks before buying ---
min_liquidity_usd = 10_000

[convergence.paper_trading]
buy_amount_usd = 5
# Sell half at 2x.
take_profit_pct = 100
take_profit_sell_fraction = 0.5
# Sell everything left at -30%.
stop_loss_pct = 30
# Sell everything left once this many of the wallets that triggered the buy
# have sold the token.
exit_when_wallets_sell = 2
# After take profit, sell the rest when it falls this % from its peak...
trailing_stop_pct = 40
# ...and never hold longer than this.
max_hold_hours = 24
# Fees + slippage for a full buy-and-sell, as a % of the money put in.
round_trip_cost_pct = 5
allow_rebuy = false

# ---------------------------------------------------------------------
# LAUNCH STRATEGY: a fourth paper strategy that tests sniping brand-new
# pump.fun tokens. It runs all the time on your own small server
# (launch_bot.py; see deploy/LAUNCH_SERVER_SETUP.md), not on GitHub, and
# pushes its results here about once an hour. Paper trading only: it reads
# PumpPortal's free data feed and never uses a wallet, a private key or
# PumpPortal's trading API.
# ---------------------------------------------------------------------
[launch]
enabled = true
# All three speeds stopped on 2026-10-05: losing after costs, and without
# the trade feed the 5s and 30s speeds bought at the creation price. Once the
# last positions have closed (within 30 minutes), the launch-bot service can
# be turned off (deploy/LAUNCH_SERVER_SETUP.md, Part K).
# stopped = true: no new buys. Positions still open finish under their
# normal exits; the journal, positions and other files are kept. A position
# still without a price 10 minutes after its 30-minute time stop (a token
# DexScreener never listed) is sold at its last known price, with the normal
# costs, marked "closed after the bot was stopped".
stopped = true
# PumpPortal's free real-time data feed (read-only).
ws_url = "wss://pumpportal.fun/api/data"

# Caps: at most this many new launches traded an hour (the same launches
# are traded by all three speeds), and at most this many open per speed.
max_new_trades_per_hour = 10
max_open_per_speed = 30

# Skip copycats: an earlier launch (seen by the bot) with the same name or
# symbol within this many days.
copycat_window_days = 7
# Skip creators with a dead token: an earlier launch of theirs (seen by the
# bot, within creator_memory_days) that is older than dead_after_minutes and
# never graduated.
dead_after_minutes = 60
creator_memory_days = 7

# Flag a launch if the creator bought in the creation transaction, or other
# wallets bought within first_block_seconds (or in the same block, if the
# feed says which block). The bot doesn't get the trade feed (it needs an
# API key and a funded wallet), so only the creator's buy is known: flagged
# means the creator bought. With skip_flagged =
# false, flagged launches are still traded and the flag is recorded, so you
# can compare flagged and clean launches later.
first_block_seconds = 1.0
skip_flagged = false

# If a held token's price hasn't moved on the feed for this long (or it
# graduated), its price is read from DexScreener instead. Without the trade
# feed the only feed price is the one at creation, so after this long every
# held token is priced from DexScreener.
stale_price_seconds = 60

[launch.paper_trading]
# Pretend dollars per buy.
buy_amount_usd = 5
# Sell half at 2x...
take_profit_pct = 100
take_profit_sell_fraction = 0.5
# ...and everything left at -30% or 30 minutes after the buy.
stop_loss_pct = 30
time_stop_minutes = 30
allow_rebuy = false
# Costs on every buy and every sell: a trading-bot fee and pump.fun's own
# fee (up to 0.95% for small coins since September 2025).
bot_fee_pct = 1.0
platform_fee_pct = 0.95

# The three speeds, each with its own journal in data/launch/<name>/.
# priority_fee_sol is paid on every buy and every sell (faster = higher
# fees to beat other bots); extra_slippage_pct is on top of the price at
# that moment, on every buy and every sell, for bots trading ahead of you.
[[launch.speeds]]
name = "5s"
delay_seconds = 5
priority_fee_sol = 0.003
extra_slippage_pct = 5

[[launch.speeds]]
name = "30s"
delay_seconds = 30
priority_fee_sol = 0.001
extra_slippage_pct = 5

[[launch.speeds]]
name = "90s"
delay_seconds = 90
priority_fee_sol = 0.0005
extra_slippage_pct = 5

# ---------------------------------------------------------------------
# MOMENTUM STRATEGY: buy a new pump.fun launch only when it rises fast in its
# first minutes, on real buying (momentum_bot.py on your server; see
# screener/momentum.py). Fed by the free Solana public RPC (read-only, no
# key). Costs and exits are the launch bot's ([launch.paper_trading], with
# the priority fee and slippage of its costs_like_speed). Paper trading only.
# ---------------------------------------------------------------------
[momentum]
enabled = true
folder = "momentum"
# Free public Solana RPC websockets (no key, no sign-up), tried in this
# order. The bot reconnects to the same one after a drop; when a connection
# lasted under stable_seconds (or never got going), it moves on to the next.
# python momentum_bot.py --check-feeds tries each one for 15 seconds.
ws_urls = ["wss://api.mainnet-beta.solana.com", "wss://solana-rpc.publicnode.com"]
# Reconnect after reconnect_seconds; only once every endpoint has failed in a
# row does the wait double, up to max_reconnect_seconds.
reconnect_seconds = 1
max_reconnect_seconds = 15
stable_seconds = 120
costs_like_speed = "90s"
# Launches 1-10 minutes old, on the bonding curve, less than this far to
# graduating.
min_age_seconds = 60
max_age_seconds = 600
max_curve_progress_pct = 80
# In each variant's window: at least this many buys, from this many
# different wallets; buys outnumbering sells this many to 1; this much net
# SOL buying; no wallet over this share of the SOL bought; the creator
# hasn't sold.
min_buys = 15
min_unique_buyers = 10
min_buy_sell_ratio = 1.5
min_net_sol = 3
max_wallet_buy_share_pct = 30
# The launch bot's skips (copycat names, creators with a dead token), from
# launches this bot has seen.
copycat_window_days = 7
dead_after_minutes = 60
creator_memory_days = 7
# The fill: the first trade at least this long after the signal (none within
# fill_timeout_seconds = no buy).
fill_delay_seconds = 5
fill_timeout_seconds = 60
# Per variant.
max_buys_per_hour = 10
max_open = 20
# The feed counts as down when nothing arrived for feed_stale_seconds (no
# new buys then, nor for a window that overlaps it); after watchdog_seconds
# of silence it reconnects (the feed sends about 25 messages a second).
feed_stale_seconds = 10
watchdog_seconds = 15
# The health section warns when the feed was down more than this % of the
# last 24 hours.
max_down_pct = 5
# Held tokens are priced from DexScreener once the feed has no trade for
# this long (or they graduate).
stale_price_seconds = 60
# Near-misses logged: the rise came but another rule failed, or everything
# else passed and the rise reached this fraction of the variant's.
near_miss_rise_fraction = 0.8

# The three variants, side by side, each with its own journal in
# data/momentum/<name>/: a rise of rise_pct within window_minutes.
# stopped = true: that variant makes no new buys (stopped on 2026-10-05:
# losing even before costs); its journal is kept.
[[momentum.variants]]
name = "30pct-2min"
rise_pct = 30
window_minutes = 2
stopped = true

[[momentum.variants]]
name = "50pct-3min"
rise_pct = 50
window_minutes = 3
stopped = true

[[momentum.variants]]
name = "100pct-5min"
rise_pct = 100
window_minutes = 5
# Stopped on 2026-10-07: 24% wins where 48% were needed (-$353).
stopped = true

# ---------------------------------------------------------------------
# NEWS STRATEGY: buy a coin right after real, official news (paper only)
# ---------------------------------------------------------------------
# Reads official sources only (press-release wires, project blogs, exchange
# announcements), names the coin with CoinGecko's free coin list, and runs
# rule-based checks (no AI, no X). Every candidate is logged with each check's
# result to data/news/candidates.csv. See screener/news.py.
[news]
enabled = true
# Runs inside the 5-minute workflow, but only checks the news on runs at
# least this many minutes apart (2 minutes' slack for GitHub's jitter).
every_minutes = 15

# --- CoinGecko free plan ---
# The free "Demo" plan allows 10,000 calls a month with a free API key (put it
# in the COINGECKO_API_KEY secret). Without a key the public API is tried, but
# it's often rate-limited on GitHub's shared servers. The bot stops looking up
# new candidates (but still prices open positions while calls last) at this
# many calls a month. The news listings bot on your server has its own count
# ([news_listings] coingecko_monthly_calls): together they stay under the
# free plan's 10,000 even if both use the same key.
coingecko_monthly_calls = 5500
# Pages of CoinGecko's coin list (250 coins a page, biggest first) that news
# is matched against. Only fetched on runs with crypto news to check.
coin_pages = 2

# --- The checks ---
# News older than this when the bot sees it is too late.
max_age_minutes = 180
# Coin size, so a move is real and tradable.
min_market_cap_usd = 20_000_000
min_volume_usd = 1_000_000
# Skip coins that already moved: the news is priced in.
max_change_1h_pct = 15
max_change_24h_pct = 40
# Don't buy the same coin again within this many days.
cooldown_days = 3

# One-word coin names that are also everyday words ("Flow", "Core") need
# their ticker - "(FLOW)" or "$FLOW" - or "Network"/"Protocol"/"Token"... right
# after the name. Names listed here don't.
unambiguous_names = ["Bitcoin", "Ethereum", "Solana", "Cardano", "Chainlink", "Avalanche",
                     "Polkadot", "Litecoin", "Dogecoin", "XRP", "TRON", "Stellar", "Hedera",
                     "Algorand", "Tezos", "Aptos", "Arbitrum", "Toncoin", "Monero", "Uniswap",
                     "Aave", "Filecoin", "Polygon", "Quant", "Ondo", "Injective", "Kaspa"]
# Mentioned in passing ("accepts Bitcoin and Ether"), these don't count when
# another coin is the subject.
background_coins = ["bitcoin", "ethereum", "tether", "usd-coin"]
stablecoin_symbols = ["usdt", "usdc", "dai", "fdusd", "usde", "tusd", "pyusd", "usdd", "usds",
                      "frax", "lusd", "gusd", "usdp", "eurc", "rlusd", "usd1", "usdtb"]
# A press release must mention crypto at all.
crypto_words = ["crypto", "cryptocurrency", "blockchain", "token", "tokens", "tokenized",
                "tokenization", "digital asset", "digital assets", "stablecoin", "web3",
                "on-chain", "onchain", "DeFi", "decentralized", "distributed ledger",
                "mainnet", "smart contract"]
# Real catalysts...
catalyst_words = ["selects", "selected", "partners with", "partnership with", "launches",
                  "launched", "goes live", "went live", "is live", "mainnet launch",
                  "integrates", "integration with", "adopts", "chooses", "acquires",
                  "acquisition of", "approved", "approval", "granted", "signs", "signed",
                  "agreement with", "collaboration with", "invests in", "strategic investment"]
# ...for exchange announcements, a new listing ("WOJAK is available for
# trading!", "OKX to list CARDS/USDT")...
exchange_words = ["will list", "to list", "lists", "listing", "will add", "adds",
                  "trading starts", "now available", "available for trading", "will launch",
                  "launches"]
# ...and for SEC filings, a new fund's first registration (S-1), not an
# amendment (S-1/A).
filing_words = ["S-1 filed"]
# Hype or not-yet-real...
hype_words = ["exploring", "explores", "in talks", "in discussions", "potential partnership",
              "potential listing", "rumor", "rumour", "reportedly", "speculation",
              "memorandum of understanding", "MoU", "non-binding", "letter of intent",
              "price prediction", "could reach", "presale", "pre-sale", "airdrop", "giveaway",
              "100x", "1000x"]
# ...bad news...
bad_news_words = ["hack", "hacked", "exploit", "exploited", "delist", "delisting", "lawsuit",
                  "sued", "charges", "charged", "fraud", "investigation", "halts", "suspends",
