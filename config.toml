# =====================================================================
#  SETTINGS FOR THE MEMECOIN SCREENER
#  You can change any number below with a plain text editor.
#  Lines starting with "#" are notes for humans and are ignored.
#  After editing, just run the program again. No other changes needed.
# =====================================================================

# ---------------------------------------------------------------------
# FILTERS: a token must pass EVERY one of these to be "bought" (on paper)
# ---------------------------------------------------------------------
[filters]

# Only tokens that have "graduated" from the pump.fun bonding curve and
# now trade on a real exchange pool. These are DexScreener's names for them.
allowed_dexes = ["pumpswap", "raydium"]

# Market cap = price x number of tokens, in US dollars.
min_market_cap_usd = 100_000
max_market_cap_usd = 5_000_000

# Liquidity = how much money sits in the trading pool.
# Low liquidity means your sell could crash the price.
min_liquidity_usd = 30_000

# The 10 biggest wallets together must own LESS than this % of all tokens.
max_top10_holders_pct = 30

# The wallet that created the token must own LESS than this %.
max_creator_pct = 5

# At least this % of the pool's LP tokens must be locked or burned
# (so the creator can't pull the money out of the pool).
min_lp_locked_pct = 95

# If true, the pool's own wallet (which holds tokens for trading) is NOT
# counted as a "top holder". Leave this true.
exclude_pools_from_holders = true

# Skip tokens whose price went up more than this % in the last 24 hours
# (to avoid buying at the top of a huge spike).
max_price_change_24h_pct = 300

# The token must have at least this many trades in the last 24 hours...
min_txns_24h = 500
# ...and more buys than sells (true = required, false = ignored).
require_more_buys_than_sells = true

# Insider networks (groups of linked wallets) are shown as a WARNING.
# Set this to true if you'd rather treat them as a hard FAIL.
insider_networks_are_fail = false

# ---------------------------------------------------------------------
# PAPER TRADING: pretend trades, no real money ever
# ---------------------------------------------------------------------
[paper_trading]

# Pretend dollars "spent" on each buy.
buy_amount_usd = 10

# When the price is up this % from where we bought, sell HALF.
take_profit_pct = 50
take_profit_sell_fraction = 0.5

# Sell everything that's left if the price falls this % below our buy price.
stop_loss_pct = 30

# Sell everything that's left if the price falls this % below its highest point
# since we bought (a "trailing stop" that locks in gains).
trailing_stop_pct = 40

# If we've held this many hours and the price has moved less than
# stale_move_pct (up OR down), give up and sell.
max_hold_hours = 48
stale_move_pct = 10

# Pretend cost of fees + slippage for one full buy-and-sell, as a % of the
# money put in. Charged proportionally each time we sell part of a position.
round_trip_cost_pct = 3

# If false, never buy the same token twice (even after we've sold it).
allow_rebuy = false

# ---------------------------------------------------------------------
# EARLY STRATEGY: a second paper strategy that runs alongside the one above
# (its own positions and journal in data/early/). It looks for tokens under
# 6 hours old and buys them on a pullback after their first spike.
# Paper trading only: no wallet, no keys, no real orders.
# ---------------------------------------------------------------------
[early]
enabled = true

# Only tokens that graduated to one of these (DexScreener's names)...
allowed_dexes = ["pumpswap", "raydium"]
# ...at least this many minutes ago...
min_minutes_since_graduation = 30
# ...and that are at most this many hours old.
max_token_age_hours = 6

# Pullback entry: the price must have spiked at least min_spike_pct, then
# fallen back between pullback_min_pct and pullback_max_pct below its peak,
# not be falling over the last 5 minutes, and have more buys than sells over
# the last hour.
min_spike_pct = 50
pullback_min_pct = 20
pullback_max_pct = 50

# Enough money in the pool to get out again.
min_liquidity_usd = 10_000
# The 10 biggest wallets (pools excluded) must own LESS than this %.
max_top10_holders_pct = 20
# At least this % of the pool's LP tokens must be locked or burned.
min_lp_locked_pct = 95

# Skip a token if another token with the same name or symbol was launched
# within this many days (copycats).
copycat_window_days = 7

# A token worth less than this is "dead". Its creator is remembered, and any
# later token from them is skipped.
dead_token_max_mcap_usd = 5_000

# How many pages (20 pools each) of GeckoTerminal's newest pools to read,
# and at most how many never-seen tokens to look up on RugCheck per run.
gecko_pages = 3
max_new_tokens_per_run = 60

[early.paper_trading]
# Pretend dollars per buy (same as the main strategy, so results compare).
buy_amount_usd = 10
# Sell half at 2x.
take_profit_pct = 100
take_profit_sell_fraction = 0.5
# Sell everything left if the price falls this % below the buy price.
stop_loss_pct = 30
# Sell everything if take profit hasn't happened after this many minutes.
time_stop_minutes = 45
# After take profit, sell the rest when it falls this % from its peak...
trailing_stop_pct = 40
# ...or after this many hours, whichever comes first.
max_hold_hours = 24
# Fees + slippage for a full buy-and-sell, as a % of the money put in.
# Higher than the main strategy's 3% because young pools are thinner.
round_trip_cost_pct = 5
allow_rebuy = false

# ---------------------------------------------------------------------
# GITHUB ISSUES: only used by the scheduled GitHub run
# ---------------------------------------------------------------------
[github_issues]
# Each token that passes every filter gets one issue titled "PASSED: SYMBOL"
# with this label. It is closed with the result when the paper position closes.
label = "passed"
# Shown as a warning in every issue. Change the wording to whatever you like.
note = "Passing the filters is not a buy signal. Before acting, answer in one sentence: Why does this coin exist? Why now? Who will buy from me at a higher price? If you can't, skip it."

# ---------------------------------------------------------------------
# TECHNICAL: how the program talks to the free public APIs
# ---------------------------------------------------------------------
[api]
# Seconds to wait between RugCheck requests (be polite to free services).
rugcheck_delay_seconds = 1.5
# Give up on any single request after this many seconds.
timeout_seconds = 20
# Only run the (slower) RugCheck safety check on tokens that already passed
# the market checks. Set to false to safety-check every candidate.
skip_safety_if_market_fails = true

[files]
# Where results are saved (created automatically).
data_folder = "data"
