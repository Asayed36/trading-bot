                  "monitoring tag"]
# ...and paid content.
paid_words = ["sponsored", "paid content", "advertorial", "promoted content", "paid press release"]
# Well-known institutions: one must be named in a press release or blog post.
institutions = ["JPMorgan", "J.P. Morgan", "Citi", "Citigroup", "Bank of America", "Wells Fargo",
                "Goldman Sachs", "Morgan Stanley", "BNY", "State Street", "HSBC", "Barclays",
                "Deutsche Bank", "UBS", "BNP Paribas", "Santander", "Standard Chartered",
