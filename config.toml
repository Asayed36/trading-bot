# --- Sources ---
# kind: "press" (press-release wire), "blog" (a project's own blog: set coin
# to its CoinGecko id), "exchange" (listing announcements and new trading
# pairs), "regulator" (the SEC's press releases) or "filing" (SEC EDGAR).
# Press and regulator items that don't mention crypto are skipped.
# format: "rss" (RSS or Atom, the default), "binance", "okx" or "bybit"
# (their public announcement lists), "markets" (an exchange's public list of
# trading pairs: a coin that wasn't there before is a new listing; the first
# read only saves the list), "html" (a blog page without a feed: the links
# matching link_pattern) or "edgar" (EDGAR's latest S-1 filings, funds only).
# dates = "day": the source gives only the day, so a post from the last 2
# days counts as first seen when the bot sees it. enabled = false turns a
# source off. stale_days: how long it may go without anything new before the
# health check warns (default: press 4, exchange 14, blog 30, regulator 14,
# filing 4). runs_on = "server": read every minute by the news listings bot
# on your server (news_listings_bot.py, [news_listings] below) instead of
# here on GitHub. Each run's log says which sources worked; fix or remove any
# that keep failing. Feed addresses change now and then. To test them all
# by hand: python -m screener.news --check-sources (or run the "News
# sources check" workflow on GitHub).

# --- Press-release wires ---
[[news.sources]]
# PR Newswire's crypto and blockchain lists are slow and include unrelated
# releases; its all-news feed (the latest 20, a few hours' worth on a
# weekday) catches crypto releases filed under other categories.
name = "PR Newswire"
kind = "press"
url = "https://www.prnewswire.com/rss/news-releases-list.rss"

[[news.sources]]
name = "PR Newswire crypto"
kind = "press"
url = "https://www.prnewswire.com/rss/financial-services-latest-news/cryptocurrency-list.rss"

[[news.sources]]
name = "PR Newswire blockchain"
kind = "press"
url = "https://www.prnewswire.com/rss/consumer-technology-latest-news/blockchain-list.rss"

[[news.sources]]
# GlobeNewswire's latest 20 releases from public companies (its documented
# feed).
name = "GlobeNewswire"
kind = "press"
url = "https://www.globenewswire.com/RssFeed/orgclass/1/feedTitle/GlobeNewswire%20-%20News%20About%20Public%20Companies"

[[news.sources]]
# Releases tagged "cryptocurrency" and "blockchain", from any company.
name = "GlobeNewswire crypto"
kind = "press"
url = "https://www.globenewswire.com/RssFeed/keyword/cryptocurrency"

[[news.sources]]
name = "GlobeNewswire blockchain"
kind = "press"
url = "https://www.globenewswire.com/RssFeed/keyword/blockchain"

[[news.sources]]
# Business Wire's all-news feed.
name = "Business Wire"
kind = "press"
url = "https://feed.businesswire.com/rss/home/?rss=G1QFDERJXkJcFVJYWQ=="

# --- Exchanges ---
[[news.sources]]
# Binance's "New Cryptocurrency Listing" list. It works: Binance simply
# posts there only every few days.
name = "Binance listings"
runs_on = "server"
kind = "exchange"
format = "binance"
url = "https://www.binance.com/bapi/composite/v1/public/cms/article/list/query?type=1&catalogId=48&pageNo=1&pageSize=20"

[[news.sources]]
name = "Kraken blog"
runs_on = "server"
kind = "exchange"
url = "https://blog.kraken.com/feed/"

[[news.sources]]
# Coinbase posts no listing feed: a coin that appears in its public list of
# trading pairs is a new listing.
name = "Coinbase new pairs"
runs_on = "server"
kind = "exchange"
format = "markets"
exchange = "coinbase"
url = "https://api.exchange.coinbase.com/products"
trade_url = "https://exchange.coinbase.com/trade/{symbol}-USD"

[[news.sources]]
# Upbit's listing notices refuse GitHub's US servers (error 403), so new
# coins are found in its public market list instead (KRW, BTC and USDT
# markets).
name = "Upbit new markets"
runs_on = "server"
kind = "exchange"
format = "markets"
exchange = "upbit"
url = "https://api.upbit.com/v1/market/all"
trade_url = "https://upbit.com/exchange?code=CRIX.UPBIT.KRW-{symbol}"

[[news.sources]]
# OKX's "New listings" announcements. Seen from GitHub's US servers, OKX
# shows its US announcements only, so its spot market list (below) is
# watched too.
name = "OKX listings"
kind = "exchange"
format = "okx"
url = "https://www.okx.com/api/v5/support/announcements?annType=announcements-new-listings"
# Its US listings are rare (the last one on July 30, 2026): only warn after
# 4 months without one.
stale_days = 120

[[news.sources]]
name = "OKX new markets"
runs_on = "server"
kind = "exchange"
format = "markets"
exchange = "okx"
exchange_name = "OKX"
url = "https://www.okx.com/api/v5/public/instruments?instType=SPOT"
trade_url = "https://www.okx.com/trade-spot/{symbol}-usdt"

[[news.sources]]
# Bybit's new-listing announcements. Bybit blocks US addresses, including
# GitHub's servers ("blocked from your country"), so this is off; turn it on
# only if the bot runs from a country Bybit serves.
name = "Bybit listings"
kind = "exchange"
format = "bybit"
url = "https://api.bybit.com/v5/announcements/index?locale=en-US&type=new_crypto&limit=20"
enabled = false
note = "Bybit blocks GitHub's US servers"

# --- The SEC ---
[[news.sources]]
# The SEC asks automated readers to say who they are (no email is sent).
name = "SEC press releases"
kind = "regulator"
url = "https://www.sec.gov/news/pressreleases.rss"
headers = {User-Agent = "trading-bot-news", Accept = "*/*"}

[[news.sources]]
# EDGAR's latest S-1 filings: kept only for funds (ETF, trust, fund), and
# matched to the coin in the fund's name ("Canary PEPE ETF").
name = "SEC EDGAR fund filings"
kind = "filing"
format = "edgar"
url = "https://www.sec.gov/cgi-bin/browse-edgar?action=getcurrent&type=S-1&company=&dateb=&owner=include&count=100&output=atom"
headers = {User-Agent = "trading-bot-news", Accept = "*/*"}

# --- Project blogs (each tied to its coin) ---
[[news.sources]]
name = "Quant blog"
kind = "blog"
coin = "quant-network"
url = "https://quant.network/feed/"

[[news.sources]]
# Chainlink's blog has no feed (blog.chain.link/feed/ is a web page); its
# press releases have one, dated by day only.
name = "Chainlink press releases"
kind = "blog"
coin = "chainlink"
url = "https://chain.link/press-releases/rss.xml"
dates = "day"

[[news.sources]]
name = "Solana news"
kind = "blog"
coin = "solana"
url = "https://solana.com/news/rss.xml"

[[news.sources]]
# Ripple's blog has no feed: the posts linked from its page.
name = "Ripple insights"
kind = "blog"
coin = "ripple"
format = "html"
url = "https://ripple.com/insights/"
link_pattern = "^/insights/[a-z0-9-]{8,}/?$"

[[news.sources]]
# Avalanche's blog has no feed either.
name = "Avalanche blog"
kind = "blog"
coin = "avalanche-2"
format = "html"
url = "https://www.avax.network/about/blog"
link_pattern = "^/about/blog/[a-z0-9-]{8,}$"

[[news.sources]]
name = "Hedera blog"
kind = "blog"
coin = "hedera-hashgraph"
url = "https://hedera.com/blog/rss.xml"

[[news.sources]]
name = "Stellar blog"
kind = "blog"
coin = "stellar"
url = "https://stellar.org/blog/rss.xml"

[news.ai]
# An AI second opinion on every crypto-related item (screener/news_ai.py):
# Claude Haiku 4.5, through Anthropic's API, with the key in the
# CLAUDE_API_KEY repository secret (Settings -> Secrets and variables ->
# Actions). It names the coin, says whether the headline is a real positive
# catalyst, and flags wrong coin matches and repeats. Each verdict is logged
# next to the rule-based result in data/news/ai_verdicts.csv. Without the
# key, past the daily limit, or if the API fails, items are logged as "not
# checked" and the rule-based checks carry on as before.
enabled = true
# At most this many AI checks a day (UTC). Each costs about $0.001-0.002, so
# 100 a day is at most about $0.20.
daily_limit = 100
# false: the AI only gives its opinion (logged, for comparing); the
# rule-based checks alone decide the paper buys. true: a candidate also needs
# the AI's yes (when the AI gave no answer, the rule-based checks decide).
must_pass = false
max_tokens = 400
timeout_seconds = 20

[news_listings]
# The news listings bot (news_listings_bot.py) on your server: the
# [[news.sources]] with runs_on = "server" (the exchange listings: Binance,
# Kraken, and new coins on Coinbase, Upbit and OKX), checked every minute
# instead of every 15 minutes on GitHub. It uses the news strategy's coin
# matching, checks, AI check, costs and exits (everything under [news]),
# with its own positions and journal in data/news-listings/, so the two can
# be compared. Paper trading only.
enabled = true
folder = "news-listings"
every_seconds = 60
# Open positions' prices from CoinGecko only this often (the exits are about
# days); new listings are always checked at once.
prices_every_minutes = 15
# Its own CoinGecko count (see coingecko_monthly_calls under [news]).
coingecko_monthly_calls = 4000
# Its own AI check limit a day (the key is on the server: see
# deploy/LAUNCH_SERVER_SETUP.md, Part J).
ai_daily_limit = 50
# Paper buys pay 1.5% over CoinGecko's price, for a person's reaction time
# (since 2026-10-09; the daily comparison says from when). GitHub's news
# strategy doesn't.
buy_slippage_pct = 1.5

# "news (listings) fast": a second paper version that buys the same signals
# at the same moment and price as news (listings) above, but exits within
# hours (listing gains tend to come in the first minutes to hours and fade
# within a week or two). Its own positions and journal in
# data/news-listings/fast/; news (listings) itself is unchanged.
[news_listings.fast]
enabled = true
label = "news (listings) fast"
folder = "fast"                 # inside [news_listings] folder
# Its open positions' prices from CoinGecko this often (while it holds
# something), counted in news (listings)' CoinGecko calls above.
prices_every_minutes = 2

[news_listings.fast.paper_trading]
buy_amount_usd = 10
# Sell half at +20%...
take_profit_pct = 20
take_profit_sell_fraction = 0.5
# ...then the rest 10% below its highest price since the buy. Before that,
# and for whatever is left: everything at -10% from entry, or after 6 hours.
trailing_stop_pct = 10
stop_loss_pct = 10
max_hold_hours = 6
allow_rebuy = true
# The same costs and buy slippage as news (listings).
round_trip_cost_pct = 1
buy_slippage_pct = 1.5

[news.paper_trading]
# Pretend dollars per buy.
buy_amount_usd = 10
# Sell half at +50%...
take_profit_pct = 50
take_profit_sell_fraction = 0.5
# ...and everything left at -20% from entry, 25% below the highest price
# since entry, or after 7 days.
stop_loss_pct = 20
trailing_stop_pct = 25
max_hold_days = 7
# A later, different piece of news about the same coin can be bought again
# (after cooldown_days above).
allow_rebuy = true
# Fees + slippage for a full buy-and-sell on an exchange, as a % of the money
# put in. These are bigger, exchange-listed coins, so lower than the memecoin
# strategies.
round_trip_cost_pct = 1

# ---------------------------------------------------------------------
# ROBINHOOD STRATEGY: graduated memecoins on Robinhood Chain (chain 4663),
# see screener/robinhood.py. Its own positions and journal in
# data/robinhood/. Paper trading only: no wallet, no keys, no real orders.
# Data: GeckoTerminal (new pools), DexScreener (prices), GoPlus (contract
# checks) and the chain's public RPC (holders). All free, no key.
# ---------------------------------------------------------------------
[robinhood]
enabled = true
# Stopped on 2026-10-07: 17% wins where 61% were needed (-$101). stopped =
# true: no new buys; it only runs (prices and exits) while it still holds a
# position; its journal and files are kept.
stopped = true
rpc_url = "https://rpc.mainnet.chain.robinhood.com"

# Pools from 30 minutes to 6 hours old are checked; each pool at most every
# recheck_minutes, and at most max_candidates_per_run pools a run.
min_pool_age_minutes = 30
max_pool_age_hours = 6
recheck_minutes = 60
max_candidates_per_run = 10
# Minimum liquidity in the pool (DexScreener), in USD, for a launchpad
# without its own min_liquidity_usd (see the launchpads below).
min_liquidity_usd = 10000
# The main strategy's market checks, with this chain's numbers (DexScreener,
# the same pool; unknown counts as a fail): a market cap of at least this
# (USD), not down more than this % in 24 hours, and more buys than sells in
# the last hour.
min_market_cap_usd = 25000
max_drop_24h_pct = 50
# Copycats: a token fails when another Pons or Pools.trade token with the
# same name or symbol graduated before it in the last N days. Ignored: ones
# that graduated after it, and clones whose liquidity is
# copycat_clone_liquidity_pct% or more of their market cap (real graduations
# have 30-60%). Of the rest, the earliest graduation is the original. The
# launchpad tokens are the ones GeckoTerminal has listed, remembered N days.
copycat_window_days = 7
copycat_clone_liquidity_pct = 90

# GeckoTerminal allows only a few calls a minute from GitHub's runners (it
# said 429 after about 7 in the probe, and about 3 runs in 10 got a 429 with
# 3 calls 6.5 s apart), so at most this many a run, spaced out. Pons'
# graduations are read from the chain (below), so its GeckoTerminal list is
# only read when there are calls to spare: the lists are Pools.trade's, then
# the newest pools, then Pons'. After a 429, one retry gecko_retry_seconds
# later. The pools seen are kept on a watchlist for later runs.
gecko_calls_per_run = 2
gecko_gap_seconds = 10
gecko_retry_seconds = 20
# GoPlus token security (no key): at most this many tokens a run, spaced out.
goplus_max_per_run = 8
goplus_gap_seconds = 2.0

# Holder checks (Pons tokens), rebuilt from the token's Transfer events on
# the public RPC. The creator is whoever sent the transaction that minted
# the token. Pools, launchpad contracts and burn addresses are left out of
# the top 10 (excluded_holders, plus the token, its curve and its pool).
max_creator_pct = 5
max_top10_pct = 30
# A cluster: cluster_min_size or more wallets, each holding at least
# cluster_min_holder_pct of the supply, whose balances are within
# cluster_tolerance_pct of each other (bundled buys), and that together hold
# cluster_min_share_pct% of the supply or more.
cluster_min_size = 5
cluster_min_share_pct = 3
cluster_min_holder_pct = 0.1
cluster_tolerance_pct = 0.5
holder_checks_per_run = 4
holder_lookback_hours = 72     # how far before graduation to look for the mint
holder_rpc_calls = 40          # eth_getLogs calls per token at most
rpc_log_blocks = 200000        # blocks per eth_getLogs call (halved if refused)
# When the RPC says 429 (too many requests): wait and try again, this many
# times, rpc_retry_seconds longer each time (5 s, 10 s, 15 s), waiting no
# more than rpc_retry_budget_seconds in all in a run.
rpc_retries = 3
rpc_retry_seconds = 5
rpc_retry_budget_seconds = 120
# Pons graduations on chain (read-only): the tokens that graduated in the
# last graduation_count_hours, from the graduation event's logs. The run log
# compares them with GeckoTerminal's lists, and the ones GeckoTerminal hasn't
# listed are put on the watchlist too, so every graduation gets the same
# checks. The first read covers the whole window in at most
# graduation_rpc_calls eth_getLogs calls (an unfinished read carries on next
# run); after that only the new blocks are read, at most every
# graduation_scan_minutes (usually one call). The contract and event were
# found with
# robinhood_probe.py: in a day of logs the event named every Pons token
# GeckoTerminal listed as graduating that day, with the token at topic
# pons_graduation_token_topic. Graduations not yet named are looked up on
# DexScreener (30 a call, at most onchain_lookups_per_run calls, each token
# again after onchain_lookup_retry_minutes until listed): their names and
# pools go on the watchlist and into the copycat check.
graduation_count_hours = 24
graduation_scan_minutes = 5
graduation_calls_before_checks = 3
onchain_lookups_per_run = 2
onchain_lookup_retry_minutes = 30
graduation_rpc_calls = 30
pons_graduation_contract = "0xc7819b64a1daecd7ec19856d026cb14efbd89046"
pons_graduation_topic = "0x80a5a2ff8b8c5533e5862e4e161bbcade9af6fd9d67bef56a590b062107f027f"
pons_graduation_token_topic = 1
# Found by robinhood_probe.py: Uniswap v4's PoolManager on Robinhood Chain
# (holds every v4 pool's tokens), the two Pons launch contracts, and the
# contract Pools.trade mints new tokens to.
excluded_holders = [
  "0x8366a39cc670b4001a1121b8f6a443a643e40951",
  "0x7ed598bcef8bd9edd8c97a195c6d13f40801ec7e",
  "0xe33e9e479df8802cb0866d5d05258bec4cf62948",
  "0x0000ffffbe8efe702c8703ae3477ff5de3d319c0",
]

# Only tokens on these launchpads, once they trade in a Uniswap pool.
# "dex" is GeckoTerminal's id for the launchpad's graduated pools.
# pool_fee_pct is charged on every buy and every sell: Pools.trade pools
# charge 0.25%; the fee of Pons' graduated pools isn't published, so 1% is
# assumed (the Pons curve's fee). holder_checks: rebuild holders on the RPC.
# min_liquidity_usd: this launchpad's minimum liquidity in USD.
[[robinhood.launchpads]]
name = "Pons"
dex = "pons-v2-dex"
pool_fee_pct = 1.0
holder_checks = true
min_liquidity_usd = 10000
# Its graduations are read from the chain (the graduation event above), with
# their names and pools from DexScreener: GeckoTerminal's list is a backup.
onchain_graduations = true

[[robinhood.launchpads]]
name = "Pools.trade"
dex = "uniswap-pools-trade"
pool_fee_pct = 0.25
holder_checks = false
min_liquidity_usd = 5000

[robinhood.paper_trading]
# Pretend dollars per buy.
buy_amount_usd = 10
# The same exits as the main strategy: sell half at +50%; everything left at
# -30% from entry, 40% below the highest price since entry, or after 48
# hours if the price is still within 10% of entry.
take_profit_pct = 50
take_profit_sell_fraction = 0.5
stop_loss_pct = 30
trailing_stop_pct = 40
max_hold_hours = 48
stale_move_pct = 10
allow_rebuy = false
max_open_positions = 20
# Costs on every buy and every sell (on top of the pool fee above): extra
# slippage (%), and gas per transaction in USD (Robinhood Chain is an
# Arbitrum Orbit chain: gas is usually a fraction of a cent; 0.05 is generous).
slippage_pct = 2
gas_usd_per_trade = 0.05

# ---------------------------------------------------------------------
# GITHUB ISSUES: only used by the scheduled GitHub run
# ---------------------------------------------------------------------
# ---------------------------------------------------------------------
# TRADE FEED PROBE: a 2-hour measurement, no trading (trade_feed_probe.py,
# deploy/trade-feed-probe.service). It checks whether the free Solana public
# RPC works as a live feed of pump.fun trades, for a planned strategy.
# ---------------------------------------------------------------------
[trade_feed_probe]
ws_url = "wss://api.mainnet-beta.solana.com"
# A silent gap: no message for this long while connected...
silent_gap_seconds = 5
# ...and after this long without a message, reconnect.
watchdog_seconds = 30
# Notifications whose slots jump by more than this count as a "slot jump".
slot_jump = 50
# DexScreener: one request every check_seconds for the sampled launches: a
# new launch every sample_every_seconds (at most max_sampled followed at
# once), until it's listed or listing_limit_seconds pass; then its price is
# compared for price_follow_seconds (a match = within price_match_pct).
check_seconds = 10
sample_every_seconds = 60
max_sampled = 10
listing_limit_seconds = 600
price_follow_seconds = 600
price_match_pct = 2

[github_issues]
# Each token that passes every filter gets one issue titled "PASSED: SYMBOL"
# with this label. It is closed with the result when the paper position closes.
label = "passed"
# Shown as a warning in every issue. Change the wording to whatever you like.
note = "Passing the filters is not a buy signal. Before acting, answer in one sentence: Why does this coin exist? Why now? Who will buy from me at a higher price? If you can't, skip it."

# ---------------------------------------------------------------------
# TECHNICAL: how the program talks to the free public APIs
# ---------------------------------------------------------------------
[api]
# Seconds to wait between RugCheck requests (be polite to free services).
rugcheck_delay_seconds = 1.5
# Give up on any single request after this many seconds.
timeout_seconds = 20
# Only run the (slower) RugCheck safety check on tokens that already passed
# the market checks. Set to false to safety-check every candidate.
skip_safety_if_market_fails = true

[health]
# The health section at the top of the daily comparison warns when...
# ...a strategy's last successful scheduled run is older than this,
stale_minutes = 60
# ...more scheduled runs than this failed in the last 24 hours,
max_failed_runs_24h = 0
# ...or the launch bot hasn't pushed results from your server for this long
# (it pushes about once an hour).
launch_stale_hours = 3
# The workflow file of the scheduled paper trading run.
workflow = "screener.yml"

[repair]
# Automatic repair (.github/workflows/repair.yml, screener/repair.py): after
# the daily comparison, each problem in the health section gets a GitHub
# issue. Claude Code (on GitHub, with the CLAUDE_API_KEY secret) tries to fix
# at most max_attempts_per_day a day, one attempt per issue, and opens a
# draft pull request for you to review; it never merges. Problems on your
# server or about a secret or setting are left to you ("needs-you" label).
enabled = true
model = "claude-sonnet-5-5"     # $2 / $10 per million tokens in / out
max_attempts_per_day = 1
# No new attempt once today's attempts cost this much (in USD; a run whose
# cost wasn't reported counts as assumed_usd_when_unknown).
max_daily_usd = 3
assumed_usd_when_unknown = 2
# Each attempt: at most this many steps (the workflow also stops it after 20
# minutes).
max_turns = 30
base = "main"

[files]
# Where results are saved (created automatically).
data_folder = "data"

[schedule]
# How often the GitHub workflow runs, in minutes. Keep this the same as the
# cron line in .github/workflows/screener.yml. When it changes, the next run
# records the date and time in data/schedule.json, and the daily comparison
# shows results before and after the change separately.
run_every_minutes = 5

[scanner_alert]
# Scanner alerts (.github/workflows/scanner-alert.yml): the GitHub username
# that every ALERT issue @mentions on its first line and is assigned to (the
# GitHub phone app pushes only mentions and assignments). Empty = neither.
# The scanner's memory issue never mentions or assigns anyone.
notify_user = "Asayed36"
